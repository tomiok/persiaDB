# Fuzz targets (cargo-fuzz). A separate workspace: libFuzzer needs the dated nightly from
# .github/nightly-toolchain and sanitizer flags (CLAUDE.md "Toolchain"). Run: just fuzz <target> [seconds]
[package]
name = "persia-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
persia-format = { path = "../crates/persia-format" }
persia-storage = { path = "../crates/persia-storage" }
persia-engine = { path = "../crates/persia-engine" }
# Same version and features as the workspace (no `legacy`), to read a frame's declared size in the fuzz harness.
zstd = { version = "0.14.0", default-features = false }

[workspace]

# Every untrusted-bytes parser gets a target (CLAUDE.md "Testing rules", SPEC §16.1).
[[bin]]
name = "reader"
path = "fuzz_targets/reader.rs"
test = false
doc = false
bench = false

