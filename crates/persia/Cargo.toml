[package]
name = "persia"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
persia-engine.workspace = true
persia-blob.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# This crate, with its test hooks, for its integration tests and doctests.
persia = { workspace = true, features = ["test-hooks", "async"] }
persia-blob = { workspace = true, features = ["testing"] }
persia-storage.workspace = true
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true

[features]
# The runtime-agnostic async API (`AsyncDb`, `AsyncCollection`; ADR-0064): no dependency, std futures only.
async = []
# Extended property tests: gate them with #[cfg(feature = "slow")]; nightly CI runs them.
slow = []
# The hidden `persia::internal` layer (ADR-0051): for persia-cli and the fuzz targets. Not a stable API.
internal = []
# The test hooks of ADR-0064 item 9 (maintain_now, hold_maintenance, ...), and `internal`: for this crate's tests.
test-hooks = ["internal"]

[lints]
workspace = true

[[bench]]
name = "response_json"
harness = false
