name: Bug report
description: Wrong results, crash, data loss or corruption (security issues go to SECURITY.md instead)
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A sequence of operations or a small input file. Include seeds if a test generated it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Platform and storage backend
      placeholder: "Linux x86_64, local file / s3 (MinIO)"
