name: Roadmap leaf
description: One ROADMAP.md leaf = one issue = one PR
title: "[x.y.z] short title"
labels: []
body:
  - type: input
    id: leaf
    attributes:
      label: ROADMAP leaf id
      placeholder: "1.2.3"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: SPEC sections (§x) and why this is needed.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What exactly to build.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Observable criteria.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: Unit / property / golden / fuzz / integration expected.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Edge cases, performance constraints. Definition of Done is in CLAUDE.md.
