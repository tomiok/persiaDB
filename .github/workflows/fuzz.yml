# Nightly fuzzing of every fuzz/ target (ROADMAP 1.11.1, SPEC §16.1). PRs only lint the fuzz crate (ci.yml).
# One matrix job per target, derived from fuzz/fuzz_targets/*.rs (bin name == file name, checked in
# xtask/src/repo_checks.rs), so a new target is fuzzed without editing this file.
# The corpus grown by previous runs is restored from the Actions cache, minimized and saved again, and also
# uploaded as an artifact; committed seeds in fuzz/corpus/ are only read. Crashes are uploaded as artifacts.
# The dated nightly lives in .github/nightly-toolchain (CLAUDE.md "Toolchain"). Actions are pinned to
# commit SHAs (SPEC §17).
name: fuzz

on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time per target, in seconds (1-2400; the job times out at 45 min)
        type: number
        default: 300

permissions:
  contents: read

# Serializes overlapping dispatches; a scheduled run is never cancelled.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          targets="$(find fuzz/fuzz_targets -maxdepth 1 -name '*.rs' -printf '%f\n' | sed 's/\.rs$//' | sort | jq -Rnc '[inputs]')"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
      MAX_TOTAL_TIME: ${{ inputs.seconds || 300 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dated nightly
        run: |
          nightly="$(cat .github/nightly-toolchain)"
          rustup toolchain install "$nightly" --profile minimal
          # Overrides rust-toolchain.toml (stable) for every later step, rust-cache's cache key included.
          echo "RUSTUP_TOOLCHAIN=$nightly" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          # All targets share the dependency build.
          shared-key: fuzz
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus-local/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # Same invocation as `just fuzz <target> <seconds>`: new inputs go to corpus-local/, seeds are read-only.
      - name: Fuzz
        working-directory: fuzz
        run: |
          case "$MAX_TOTAL_TIME" in
            '' | *[!0-9]*) echo "seconds must be a positive integer: $MAX_TOTAL_TIME"; exit 1 ;;
          esac
          if [ "$MAX_TOTAL_TIME" -lt 1 ] || [ "$MAX_TOTAL_TIME" -gt 2400 ]; then
            echo "seconds must be in 1..2400: $MAX_TOTAL_TIME"; exit 1
          fi
          # A target without committed seeds still runs (libFuzzer exits on a missing corpus directory).
          mkdir -p "corpus-local/$TARGET" "corpus/$TARGET"
          cargo fuzz run "$TARGET" "corpus-local/$TARGET" "corpus/$TARGET" -- \
            -max_total_time="$MAX_TOTAL_TIME" -timeout=30
      - name: Minimize corpus
        working-directory: fuzz
        run: cargo fuzz cmin "$TARGET" "corpus-local/$TARGET"
      # Saved even when a crash was found, so the next run resumes from the grown corpus.
      - name: Save corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus-local/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload corpus
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus-local/${{ matrix.target }}
          retention-days: 14
          if-no-files-found: ignore
      # Reproduce locally: cargo +<nightly> fuzz run <target> <crash file>
      - name: Upload crash
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          retention-days: 90
          if-no-files-found: ignore
