# PR and main-branch checks (ROADMAP 0.2.1, 0.3.5.2). Mirrors CLAUDE.md "Commands".
# The toolchain comes from rust-toolchain.toml; actions are pinned to commit SHAs (SPEC §17).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            fuzz -> target
          # Only main writes caches; PR runs reuse them (keeps the 10 GB repo cache stable).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # fuzz/ is its own workspace (ROADMAP 1.11.1); it builds on stable, only running it needs the nightly.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes caches; PR runs reuse them (keeps the 10 GB repo cache stable).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Fast suite only (< 2 min, CLAUDE.md); `--features slow` runs nightly (ROADMAP 0.2.3.1).
      # Feature-gated code still compiles in the lint job's `clippy --all-features`.
      - run: cargo test --workspace

  test-windows:
    # ROADMAP 2.3.9: the `cfg(windows)` code of persia-storage (positioned I/O, reserved names, the writer lock,
    # directory sync) is compiled and tested nowhere else. Only the crates below it, to keep the job short.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p persia-format -p persia-storage --all-targets --all-features -- -D warnings
      - run: cargo test -p persia-format -p persia-storage --no-fail-fast

  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (xtask check-deps)
        run: rustup toolchain install
      - name: Dependency direction and allowed list
        run: cargo xtask check-deps
      - name: PROGRESS.md is up to date
        run: cargo xtask progress --check
      - name: Golden fixtures are up to date
        run: cargo xtask fixtures --check
      - name: Dev compose file is valid and its pinned images resolve
        # Manifests only, no layers: catches an image that was deleted upstream (as minio/minio was).
        run: |
          docker compose -f docker-compose.dev.yml config --quiet
          for image in $(docker compose -f docker-compose.dev.yml config --images); do
            docker buildx imagetools inspect "$image" > /dev/null
          done

  miri:
    # ROADMAP 0.2.5: UB detection for persia-format, the only crate allowed to contain `unsafe`.
    # The dated nightly lives in .github/nightly-toolchain (CLAUDE.md "Toolchain").
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dated nightly with Miri
        run: |
          nightly="$(cat .github/nightly-toolchain)"
          echo "NIGHTLY=$nightly" >> "$GITHUB_ENV"
          rustup toolchain install "$nightly" --profile minimal --component miri,rust-src
      - run: cargo "+$NIGHTLY" miri setup
      # Unit tests + doctests only: property tests need the filesystem (proptest's failure persistence),
      # which Miri isolates, and they test pure logic that native runs already cover.
      - run: cargo "+$NIGHTLY" miri test -p persia-format --lib
      - run: cargo "+$NIGHTLY" miri test -p persia-format --doc

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # Advisories are checked daily in audit.yml, so a new RUSTSEC entry against an
          # existing dependency does not turn unrelated PRs red.
          command: check bans licenses sources
      - name: Fuzz workspace (fuzz/Cargo.lock)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
          command: check bans licenses sources
