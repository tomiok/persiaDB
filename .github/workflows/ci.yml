# PR and main-branch checks (ROADMAP 0.2.1, 0.3.5.2). Mirrors CLAUDE.md "Commands".
# The toolchain comes from rust-toolchain.toml; actions are pinned to commit SHAs (SPEC §17).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            fuzz -> target
          # Only main writes caches; PR runs reuse them (keeps the 10 GB repo cache stable).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # persia's lib with its default features and with `async` alone, the sets a user of the crate builds, and with
      # `internal` alone, the set persia-cli and the fuzz targets build (ROADMAP 10.1.40): `--all-features` turns on
      # `internal`, which makes `persia::internal` public, so an item only the CLI reaches is unused without it and
      # that line does not show it; and it turns on `async` and `test-hooks` beside `internal`. `--lib` only: the
      # tests' dev-dependency on persia itself adds `test-hooks` (and with it `internal`), so `--all-targets` would
      # lint the same lib again.
      - run: cargo clippy -p persia --lib -- -D warnings
      - run: cargo clippy -p persia --lib --features async -- -D warnings
      - run: cargo clippy -p persia --lib --features internal -- -D warnings
      # fuzz/ is its own workspace (ROADMAP 1.11.1); it builds on stable, only running it needs the nightly.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes caches; PR runs reuse them (keeps the 10 GB repo cache stable).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Fast suite only (< 2 min, CLAUDE.md); `--features slow` runs nightly (ROADMAP 0.2.3.1).
      # Feature-gated code still compiles in the lint job's `clippy --all-features`.
      - run: cargo test --workspace
      # The guide doctests and docs/ checks again, alone (ROADMAP 10.1.42): `--workspace` unifies persia's features
      # across every member it builds (persia-cli's `internal`), so only this run links the doctests to the `persia` a
      # user gets, where `persia::internal` does not compile (crates/persia-docs/src/guides.rs).
      - run: cargo test -p persia-docs
      # ADR-0025: a dependency or toolchain change that moves a built-in analyzer's output must fail its PR, not a
      # nightly run after the merge. Seconds in release (only persia-analysis is built).
      - name: Analyzer fingerprints
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p persia-analysis --release --features slow --test unicode_fingerprints

  test-windows:
    # ROADMAP 2.3.9: the `cfg(windows)` code of persia-storage (positioned I/O, reserved names, the writer lock,
    # directory sync) is compiled and tested nowhere else. Only the crates below it, to keep the job short, the
    # engine's read-only mapping tests (ADR-0017 amended: on Windows `MappedReads` defaults to `Never`), and the
    # embedded API's process tests.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p persia-format -p persia-storage --all-targets --all-features -- -D warnings
      - run: cargo test -p persia-format -p persia-storage --no-fail-fast
      # The embedded API's real-process tests (ROADMAP 10.1.9, 10.2.3): the Windows writer lock, kills and shutdown.
      - run: cargo test -p persia --test db_process --no-fail-fast
      - run: cargo test -p persia-engine --test read_only_mapped --no-fail-fast
      # A failed create removes its container under the writer lock beside it (ROADMAP 10.2.7), and a read-only Db
      # maps its pack like its container, not by default on Windows (ROADMAP 10.1.23).
      - run: "cargo test -p persia --lib --no-fail-fast -- internal::documents::tests::"
      - run: cargo test -p persia --test read_paths --no-fail-fast

  repo-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (xtask check-deps)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Dependency direction and allowed list
        run: cargo xtask check-deps
      - name: PROGRESS.md is up to date
        run: cargo xtask progress --check
      - name: Golden fixtures are up to date
        run: cargo xtask fixtures --check
      - name: just miri filters and skips match the tests they name (ROADMAP 0.6.9)
        # Lists the persia-format and persia-engine tests natively: Miri runs the same test binaries.
        run: cargo xtask miri-filters
      - name: Install dated nightly (rustdoc JSON for the public-API snapshot)
        run: rustup toolchain install "$(cat .github/nightly-toolchain)" --profile minimal
      - name: The public API of persia matches crates/persia/public-api.txt, with no rustdoc warning (ROADMAP 10.1.12, 10.1.49)
        # A change of the surface comes with the regenerated file (`just public-api`), so a reviewer sees it. rustdoc
        # runs with `-D warnings` on persia and the crates it re-exports from: this is their one docs build in CI.
        run: cargo xtask public-api --check
      - name: Dev compose file is valid and its pinned images resolve
        # Manifests only, no layers: catches an image that was deleted upstream (as minio/minio was).
        run: |
          docker compose -f docker-compose.dev.yml config --quiet
          # A failing substitution in a `for` list would not trip `-e`, so the loop could check nothing.
          images=$(docker compose -f docker-compose.dev.yml config --images)
          test -n "$images"
          for image in $images; do
            docker buildx imagetools inspect "$image" > /dev/null
          done

  miri:
    # ROADMAP 0.2.5, 0.6.6: UB detection for persia-format and the pure parsers of persia-engine (`just miri` lists
    # them and why the rest is left out).
    # The dated nightly lives in .github/nightly-toolchain (CLAUDE.md "Toolchain").
    runs-on: ubuntu-latest
    # `just miri` takes about 10 min (locally: format lib 200 s, doc 9 s, engine lib 101 s, codecs 275 s), so a test that
    # slows it down fails here early instead of at an hour.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dated nightly with Miri
        run: |
          nightly="$(cat .github/nightly-toolchain)"
          echo "NIGHTLY=$nightly" >> "$GITHUB_ENV"
          rustup toolchain install "$nightly" --profile minimal --component miri,rust-src
      - run: cargo "+$NIGHTLY" miri setup
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just
      - run: just miri

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # Advisories are checked daily in audit.yml, so a new RUSTSEC entry against an
          # existing dependency does not turn unrelated PRs red.
          command: check bans licenses sources
      - name: Fuzz workspace (fuzz/Cargo.lock)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml
          command: check bans licenses sources
