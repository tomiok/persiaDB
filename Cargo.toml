[workspace]
resolver = "3"
members = ["crates/*"]

# Inherited by every crate via `field.workspace = true`.
# `rust-version` is the MSRV and must equal the channel in rust-toolchain.toml.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
publish = false

# The only external crates allowed (CLAUDE.md "Dependencies"). Crates opt in with
# `name.workspace = true`; adding anything here needs a justification in the PR.
[workspace.dependencies]
# Internal (direction rules: CLAUDE.md "Architecture")
persia-format = { path = "crates/persia-format" }
persia-storage = { path = "crates/persia-storage" }
persia-analysis = { path = "crates/persia-analysis" }
persia-engine = { path = "crates/persia-engine" }
persia-blob = { path = "crates/persia-blob" }
persia = { path = "crates/persia" }
persia-proto = { path = "crates/persia-proto" }
persia-testutil = { path = "crates/persia-testutil" }
# Libraries
fst = "0.4.7"
roaring = "0.11.5"
zstd = "0.14.0"
crc32c = "0.6.8"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
memmap2 = "0.9.11"
ciborium = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
bytes = "1.12.1"
arc-swap = "1.9.2"
rayon = "1.12.0"
object_store = "0.14.2"
tokio = "1.53.2"
tonic = "0.14.6"
prost = "0.14.4"
axum = "0.8.9"
unicode-segmentation = "1.13.3"
unicode-normalization = "0.1.25"
# Binaries only (persia-server, persia-cli)
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
rustls = "0.23.45"
tracing-subscriber = "0.3.23"
# Dev / bench only
proptest = "1.11.0"
criterion = "0.8.2"
insta = "1.49.0"
tempfile = "3.27.0"
testcontainers = "0.28.0"
hdrhistogram = "7.6.0"

# Crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
# `deny`, not `forbid`: persia-format::mmap must be able to `allow` it (CLAUDE.md "Safety").
# Every other crate adds `#![forbid(unsafe_code)]` itself.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Data from disk, network or users must never panic (CLAUDE.md "Safety & errors").
# Test code is exempted in clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"     # &s[a..b] panics off a UTF-8 boundary (analysis slices user text)
unreachable = "deny"      # a panic that clippy::panic does not catch
undocumented_unsafe_blocks = "deny"
# No placeholders or debug leftovers in committed code (open a ROADMAP leaf instead).
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# Pedantic where practical (CLAUDE.md "Style"). The cast_* lints matter most here:
# offsets and lengths must use checked conversions (`try_from`), not `as`.
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"  # noise on every getter; add #[must_use] where it prevents real bugs
# Generated code (prost/tonic in persia-proto) will need a local
# #[allow(clippy::pedantic, unused_qualifications, missing_docs)] on its include! module.
# Checked arithmetic (arithmetic_side_effects) is enabled per crate at the root, see ROADMAP 1.1.5.
