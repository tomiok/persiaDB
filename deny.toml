# cargo-deny configuration (CLAUDE.md "Dependencies"). Run: cargo deny check
# Which external crates are allowed at all is enforced by scripts/check_deps.py
# (direct deps must come from [workspace.dependencies]); this file covers the whole graph.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every ignored advisory needs a reason and an issue link.
ignore = []

[licenses]
version = 2
# Permissive licenses compatible with distributing Persia DB under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# The allow list anticipates the allowed crates (CLAUDE.md); not all are used yet.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are `publish = false` until release; they are Apache-2.0 regardless.
ignore = true

[bans]
# Warn, not deny: tonic/object_store/testcontainers pull duplicate versions we cannot control.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Pillar 2 "Own engine": no search, SQL or KV engines, not even transitively.
# Backstop only: a name list is never complete. The real gate is scripts/check_deps.py, which
# rejects any direct dependency not on the allowed list.
deny = [
    { name = "tantivy", reason = "own engine (CLAUDE.md)" },
    { name = "tantivy-common", reason = "own engine (CLAUDE.md)" },
    { name = "tantivy-fst", reason = "own engine (CLAUDE.md)" },
    { name = "tantivy-bitpacker", reason = "own engine (CLAUDE.md)" },
    { name = "tantivy-columnar", reason = "own engine (CLAUDE.md)" },
    { name = "tantivy-sstable", reason = "own engine (CLAUDE.md)" },
    { name = "tantivy-stacker", reason = "own engine (CLAUDE.md)" },
    { name = "tantivy-query-grammar", reason = "own engine (CLAUDE.md)" },
    { name = "tantivy-tokenizer-api", reason = "own engine (CLAUDE.md)" },
    { name = "milli", reason = "own engine (CLAUDE.md)" },
    { name = "meilisearch-sdk", reason = "own engine (CLAUDE.md)" },
    { name = "surrealdb", reason = "own engine (CLAUDE.md)" },
    { name = "rusqlite", reason = "own engine (CLAUDE.md)" },
    { name = "libsqlite3-sys", reason = "own engine (CLAUDE.md)" },
    { name = "sqlite", reason = "own engine (CLAUDE.md)" },
    { name = "sqlite3-sys", reason = "own engine (CLAUDE.md)" },
    { name = "libsql", reason = "own engine (CLAUDE.md)" },
    { name = "limbo", reason = "own engine (CLAUDE.md)" },
    { name = "turso_core", reason = "own engine (CLAUDE.md)" },
